<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Personal Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f0e8;
            color: #5a3e2b;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 8%;
            background-color: #f5f0e8;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #5a3e2b;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: #5a3e2b;
            font-size: 16px;
        }

        .nav-links a:hover {
            color: #9b6b4a;
        }

        .hero {
            min-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 40px 10%;
        }

        .hero-text {
            max-width: 600px;
        }

        .hello {
            font-size: 15px;
            letter-spacing: 3px;
            font-weight: bold;
            color: #9b6b4a;
        }

        h1 {
            font-size: 70px;
            margin: 15px 0;
            color: #5a3e2b;
        }

        h1 span {
            color: #9b6b4a;
        }

        h2 {
            font-size: 30px;
            margin-bottom: 20px;
            color: #5a3e2b;
        }

        .description {
            font-size: 18px;
            line-height: 1.7;
            color: #765642;
            max-width: 500px;
        }

        .buttons {
            margin-top: 30px;
        }

        .button {
            display: inline-block;
            padding: 14px 25px;
            margin-right: 10px;
            border-radius: 30px;
            text-decoration: none;
            background-color: #8b5e3c;
            color: white;
            font-weight: bold;
        }

        .button:hover {
            background-color: #6f472d;
        }

        .secondary {
            background-color: transparent;
            color: #8b5e3c;
            border: 2px solid #8b5e3c;
        }

        .secondary:hover {
            background-color: #8b5e3c;
            color: white;
        }

        .hero-image {
    width: 300px;
    height: 300px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
}

.hero-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

        }

        .intro {
            background-color: #5a3e2b;
            color: #f5f0e8;
            text-align: center;
            padding: 70px 15%;
        }

        .intro h2 {
            color: #e8c9a8;
        }

        .intro p {
            line-height: 1.8;
            font-size: 17px;
        }

        @media (max-width: 800px) {
            .hero {
                flex-direction: column;
                text-align: center;
            }

            h1 {
                font-size: 50px;
            }

            .hero-image {
                margin-top: 40px;
            }

            .nav-links {
                gap: 12px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">CHUC'S CORNER</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <section class="hero">

        <div class="hero-text">

            <p class="hello">HELLO 👋</p>

            <h1>I'm <span>Jamil Chuc</span></h1>

            <h2>Welcome to my corner.</h2>

            <p class="description">
                This is my personal space where
                you can learn more about me, my interests, and the things
                I've been working on.
            </p>

            <div class="buttons">
                <a href="projects.html" class="button">
                    View My Projects
                </a>

                <a href="about.html" class="button secondary">
                    About Me
                </a>
            </div>

        </div>

        <div class="hero-image">
    <img src="images/me.jpeg" alt="Photo of me">
</div>


    </section>

    <section class="intro">

    </section>

</body>
</html>
